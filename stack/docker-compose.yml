services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASS}
      POSTGRES_DB: sonar
    volumes:
      - ${DATA_MNT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASS}
    volumes:
      - ${DATA_MNT}/sonarqube/data:/opt/sonarqube/data
      - ${DATA_MNT}/sonarqube/logs:/opt/sonarqube/logs
      - ${DATA_MNT}/sonarqube/extensions:/opt/sonarqube/extensions
    ports:
      - "0.0.0.0:9000:9000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  scm-mcp:
    build: ./mcp/scm_mcp
    restart: unless-stopped
    environment:
      SCM_PROVIDER: ${SCM_PROVIDER}
      SCM_API_BASE: ${SCM_API_BASE}
      SCM_REPOS: ${SCM_REPOS}
      SCM_TOKEN: ${SCM_TOKEN}
      ALLOW_WRITE: ${ALLOW_WRITE}
      REPO_ROOT: ${REPO_ROOT}
      MCP_PORT: "8080"
    volumes:
      - ${DATA_MNT}/repos:/data/repos
    ports:
      - "0.0.0.0:8081:8080"

  inspect-mcp:
    build: ./mcp/inspect_mcp
    restart: unless-stopped
    environment:
      REPO_ROOT: ${REPO_ROOT}
      REPORT_ROOT: ${REPORT_ROOT}
      SONAR_BASE_URL: ${SONAR_BASE_URL}
      SONAR_TOKEN: ${SONAR_TOKEN}
      MCP_PORT: "8080"
    volumes:
      - ${DATA_MNT}/repos:/data/repos:ro
      - ${DATA_MNT}/reports:/data/reports
    ports:
      - "0.0.0.0:8082:8080"
